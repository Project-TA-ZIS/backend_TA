name: Backend CI/CD Pipeline

on:
  push:
    branches: [ master, main, development, rafif ]
  pull_request:
    branches: [ master, main, development, rafif ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Create test environment
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          AUTH_EMAIL: ${{ secrets.AUTH_EMAIL }}
          AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}
        run: |
          echo "PORT=3000" > .env
          echo "NODE_ENV=test" >> .env
          echo "JWT_SECRET=$JWT_SECRET" >> .env
          echo "AUTH_EMAIL=$AUTH_EMAIL" >> .env
          echo "AUTH_PASSWORD=$AUTH_PASSWORD" >> .env

      - name: Run unit tests
        run: npm test -- --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: coverage/

  deploy:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_SSH_PORT || 22 }}
          script: |
            set -e
            if [ -s "$HOME/.nvm/nvm.sh" ]; then
              . "$HOME/.nvm/nvm.sh"
              nvm use --lts
            fi
            cd /var/www/project-ta/backend_TA
            git fetch origin master
            git checkout master
            git pull --ff-only origin master
            npm ci
            npx sequelize-cli db:migrate
            pm2 describe backend-ta >/dev/null \
              && pm2 restart backend-ta --update-env \
              || pm2 start src/index.js --name backend-ta
            pm2 save
